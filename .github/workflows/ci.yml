name: CI Workflow
on:
  # Run this workflow every time a new commit pushed to upstream/fork repository.
  # Run workflow on fork repository will help contributors find and resolve issues before sending a PR.
  push:
    # Exclude branches created by Dependabot to avoid triggering current workflow
    # for PRs initiated by Dependabot.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read  # for actions/checkout to fetch code
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: verify license
        run: hack/verify-license.sh
      - name: vendor
        run: hack/verify-vendor.sh
      - name: lint
        run: hack/verify-staticcheck.sh
      - name: import alias
        run: hack/verify-import-aliases.sh
  codegen:
    name: codegen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '23.4'
          # Use the automatic token, so that this task can be run in the forked repo.
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify codegen
        run: hack/verify-codegen.sh
      - name: verify crdgen
        run: hack/verify-crdgen.sh
      - name: verify protobuf
        run: hack/verify-estimator-protobuf.sh
      - name: verify swagger docs
        run: hack/verify-swagger-docs.sh
      - name: verify lifted docs
        run: hack/verify-lifted.sh
  build:
    name: compile
    needs: codegen # rely on codegen successful completion
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: compile
        run: make all
  test:
    name: unit test
    needs: build
    runs-on: ubuntu-22.04
    env:
      GOTESTSUM_ENABLED: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: make test
        run: make test
      - name: Upload coverage to Codecov
        # Prevent running from the forked repository that doesn't need to upload coverage.
        # In addition, running on the forked repository would fail as missing the necessary secret.
        if: ${{ github.repository == 'karmada-io/karmada' }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          # Even though token upload token is not required for public repos,
          # but adding a token might increase successful uploads as per:
          # https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
          token: ${{secrets.CODECOV_UPLOAD_TOKEN}}
          files: ./_output/coverage/coverage_pkg.txt,./_output/coverage/coverage_cmd.txt,./_output/coverage/coverage_examples.txt,./_output/coverage/coverage_operator.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true
  e2e:
    name: e2e test (ubuntu-22.04, ${{ matrix.k8s }})
    if: false # temporarily disabled — only testing macos e2e on this branch
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Here support the latest three minor releases of Kubernetes, this can be considered to be roughly
        # the same as the End of Life of the Kubernetes release: https://kubernetes.io/releases/
        # Please remember to update the CI Schedule Workflow when we add a new version.
        k8s: [ v1.33.0, v1.34.0, v1.35.0 ]
    steps:
      # Free up disk space on Ubuntu
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # this might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: setup e2e test environment
        run: |
          export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
          export KUBE_CACHE_MUTATION_DETECTOR=true
          hack/local-up-karmada.sh
      - name: run e2e
        run: |
          export ARTIFACTS_PATH=${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
          hack/run-e2e.sh
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_e2e_log_${{ matrix.k8s }}
          path: ${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_kind_log_${{ matrix.k8s }}
          path: /tmp/karmada/
  e2e-macos:
    name: e2e test (macos-26-intel, ${{ matrix.k8s }})
    strategy:
      fail-fast: false
      matrix:
        k8s: [ v1.35.0 ]
    # Intel runner required: ARM macOS runners block nested virtualization
    # (Apple Virtualization Framework limitation), so Colima cannot start a
    # Linux VM on ARM. Intel runners have Hypervisor.framework enabled, allowing
    # Colima to provision the Linux VM that Docker and kind run inside.
    runs-on: macos-26-intel
    # Job failure will not block the overall workflow while the macos-26-intel
    # local-up path is being validated. Remove once proven stable.
    continue-on-error: true
    timeout-minutes: 90
    env:
      COLIMA_VERSION: "0.10.1"
      LIMA_VERSION: "2.1.1"
      DOCKER_VERSION: "29.4.0"
      DOCKER_BUILDX_VERSION: "0.33.0"
      # Go and kind versions are pinned to match go.mod / hack/util.sh
      GO_VERSION: "1.25.7"
      KIND_VERSION: "v0.31.0"
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: install and start colima (docker)
        run: |
          # Install pinned versions directly from GitHub/Docker releases to avoid
          # silent version drift from brew. Versions are pinned in the job env block.
          #
          # lima: colima is a wrapper around Lima — limactl must be on PATH before colima start
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Darwin-x86_64.tar.gz" \
            | sudo tar -xz --strip=1 -C /usr/local
          # colima: runs a Linux VM via Hypervisor.framework so Docker containers work on macOS
          curl -fsSL "https://github.com/abiosoft/colima/releases/download/v${COLIMA_VERSION}/colima-Darwin-x86_64" \
            -o /usr/local/bin/colima && chmod +x /usr/local/bin/colima
          # docker: CLI to talk to the daemon inside the Colima VM
          curl -fsSL "https://download.docker.com/mac/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" \
            | tar -xz --strip=1 -C /usr/local/bin docker/docker
          # docker-buildx: hack/docker.sh passes --provenance=false to docker build which requires
          #   the buildx plugin; Colima's Docker does not include it by default
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/buildx/releases/download/v${DOCKER_BUILDX_VERSION}/buildx-v${DOCKER_BUILDX_VERSION}.darwin-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx && chmod +x ~/.docker/cli-plugins/docker-buildx
          echo "Installed: colima=$(colima version) | docker=$(docker --version) | buildx=$(docker buildx version)"
          # --cpu-type host: pass through the Intel host's CPU feature flags (SSE4.2,
          # AVX, AVX2, etc.) to the QEMU VM. Without this QEMU defaults to the
          # minimal 'qemu64' CPU model which lacks instructions that Go 1.25's
          # compiler emits, causing 'signal: illegal instruction' during 'make images'.
          colima start --cpu 4 --memory 8 --cpu-type host
          # Wait for the Docker daemon inside the Colima VM to be fully ready.
          # Avoid GNU coreutils 'timeout' which is not available on macOS runners.
          echo "Waiting for Docker daemon to be ready..."
          for i in $(seq 1 30); do
            docker info &>/dev/null && break
            sleep 2
          done
          docker info &>/dev/null || { echo "ERROR: Docker daemon not ready after 60s"; exit 1; }
      - name: install Go, kind, and kubectl inside colima VM
        run: |
          # All cluster tooling (Go, kind, kubectl) runs inside the Colima Linux VM.
          # Running inside the VM eliminates the macOS/VM IP boundary that caused kind
          # to fail: kind's net.Listen (port discovery) and Docker's port binding both
          # operate on the same Linux network stack — no cross-VM address mismatch.
          colima ssh -- bash -c "
            set -euo pipefail
            # Install build essentials (make, gcc) needed by hack/local-up-karmada.sh
            sudo apt-get update -qq && sudo apt-get install -y -qq make build-essential
            # Install Go (linux/amd64) to /usr/local/go
            curl -fsSL 'https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz' \
              | sudo tar -C /usr/local -xz
            # Install kind (linux/amd64)
            sudo curl -fsSL \
              'https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64' \
              -o /usr/local/bin/kind
            sudo chmod +x /usr/local/bin/kind
            # Install kubectl matching the k8s matrix version
            sudo curl -fsSL \
              'https://dl.k8s.io/release/${{ matrix.k8s }}/bin/linux/amd64/kubectl' \
              -o /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
            export PATH=/usr/local/go/bin:/usr/local/bin:\$PATH
            echo \"Installed inside VM: go=\$(go version) | kind=\$(kind version) | kubectl=\$(kubectl version --client)\"
          "
      - name: setup e2e test environment
        run: |
          # Run local-up-karmada.sh inside the Colima VM.
          #
          # Inside the VM, go env GOOS=linux so util::get_macos_ipaddress is a no-op
          # and HOST_IPADDRESS stays empty. kind therefore creates clusters with its
          # default apiServerAddress (127.0.0.1), which it CAN bind on the VM's
          # loopback. Docker is native (no cross-VM boundary), so port publishing
          # works correctly too. util::check_clusters_ready uses the linux code path
          # (Docker-native 172.x.y.z IPs) which are reachable by all containers.
          #
          # Lima mounts the macOS home directory into the VM at the same path, so
          # the checked-out workspace is accessible inside the VM without any copy.
          WORKSPACE="${{ github.workspace }}"
          colima ssh -- bash -c "
            set -euo pipefail
            export PATH=/usr/local/go/bin:/usr/local/bin:\$HOME/go/bin:\$PATH
            export GOPATH=\$HOME/go
            export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
            export KUBE_CACHE_MUTATION_DETECTOR=true
            cd '${WORKSPACE}'
            hack/local-up-karmada.sh
          "
      - name: run e2e
        run: |
          WORKSPACE="${{ github.workspace }}"
          colima ssh -- bash -c "
            set -euo pipefail
            export PATH=/usr/local/go/bin:/usr/local/bin:\$HOME/go/bin:\$PATH
            export GOPATH=\$HOME/go
            export ARTIFACTS_PATH='${WORKSPACE}/karmada-e2e-logs/${{ matrix.k8s }}/'
            cd '${WORKSPACE}'
            hack/run-e2e.sh
          "
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_macos_e2e_log_${{ matrix.k8s }}
          path: ${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
      - name: collect kind logs from VM
        if: always()
        run: |
          # Lima's /tmp inside the VM is not automatically mirrored back to macOS,
          # so we pull the kind logs out via SSH before the upload step.
          mkdir -p /tmp/karmada
          colima ssh -- bash -c "tar -C /tmp -czf - karmada 2>/dev/null || true" \
            | tar -C /tmp -xzf - 2>/dev/null || true
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_macos_kind_log
          path: /tmp/karmada/
