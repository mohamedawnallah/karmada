name: CI Workflow
on:
  # Run this workflow every time a new commit pushed to upstream/fork repository.
  # Run workflow on fork repository will help contributors find and resolve issues before sending a PR.
  push:
    # Exclude branches created by Dependabot to avoid triggering current workflow
    # for PRs initiated by Dependabot.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read  # for actions/checkout to fetch code
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: verify license
        run: hack/verify-license.sh
      - name: vendor
        run: hack/verify-vendor.sh
      - name: lint
        run: hack/verify-staticcheck.sh
      - name: import alias
        run: hack/verify-import-aliases.sh
  codegen:
    name: codegen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '23.4'
          # Use the automatic token, so that this task can be run in the forked repo.
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify codegen
        run: hack/verify-codegen.sh
      - name: verify crdgen
        run: hack/verify-crdgen.sh
      - name: verify protobuf
        run: hack/verify-estimator-protobuf.sh
      - name: verify swagger docs
        run: hack/verify-swagger-docs.sh
      - name: verify lifted docs
        run: hack/verify-lifted.sh
  build:
    name: compile
    needs: codegen # rely on codegen successful completion
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: compile
        run: make all
  test:
    name: unit test
    needs: build
    runs-on: ubuntu-22.04
    env:
      GOTESTSUM_ENABLED: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: make test
        run: make test
      - name: Upload coverage to Codecov
        # Prevent running from the forked repository that doesn't need to upload coverage.
        # In addition, running on the forked repository would fail as missing the necessary secret.
        if: ${{ github.repository == 'karmada-io/karmada' }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          # Even though token upload token is not required for public repos,
          # but adding a token might increase successful uploads as per:
          # https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
          token: ${{secrets.CODECOV_UPLOAD_TOKEN}}
          files: ./_output/coverage/coverage_pkg.txt,./_output/coverage/coverage_cmd.txt,./_output/coverage/coverage_examples.txt,./_output/coverage/coverage_operator.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true
  e2e:
    name: e2e test (ubuntu-22.04, ${{ matrix.k8s }})
    if: false # temporarily disabled — only testing macos e2e on this branch
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Here support the latest three minor releases of Kubernetes, this can be considered to be roughly
        # the same as the End of Life of the Kubernetes release: https://kubernetes.io/releases/
        # Please remember to update the CI Schedule Workflow when we add a new version.
        k8s: [ v1.33.0, v1.34.0, v1.35.0 ]
    steps:
      # Free up disk space on Ubuntu
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # this might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: setup e2e test environment
        run: |
          export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
          export KUBE_CACHE_MUTATION_DETECTOR=true
          hack/local-up-karmada.sh
      - name: run e2e
        run: |
          export ARTIFACTS_PATH=${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
          hack/run-e2e.sh
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_e2e_log_${{ matrix.k8s }}
          path: ${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_kind_log_${{ matrix.k8s }}
          path: /tmp/karmada/
  e2e-macos:
    name: e2e test (macos-26-intel, ${{ matrix.k8s }})
    strategy:
      fail-fast: false
      matrix:
        k8s: [ v1.35.0 ]
    # Intel runner required: ARM macOS runners block nested virtualization
    # (Apple Virtualization Framework limitation), so Colima cannot start a
    # Linux VM on ARM. Intel runners have Hypervisor.framework enabled, allowing
    # Colima to provision the Linux VM that Docker and kind run inside.
    runs-on: macos-26-intel
    # Job failure will not block the overall workflow while the macos-26-intel
    # local-up path is being validated. Remove once proven stable.
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: install and start colima (docker)
        run: |
          # colima: runs a Linux VM via Hypervisor.framework so Docker containers work on macOS
          # docker: CLI to talk to the daemon inside the Colima VM
          # docker-buildx: hack/docker.sh passes --provenance=false to docker build which requires
          #   the buildx plugin; Colima's Docker does not include it by default
          brew install colima docker docker-buildx
          mkdir -p ~/.docker/cli-plugins
          ln -sf $(brew --prefix)/opt/docker-buildx/bin/docker-buildx ~/.docker/cli-plugins/docker-buildx
          colima start --cpu 4 --memory 8
          # Wait for the Docker daemon inside the colima VM to be fully ready.
          # Avoid GNU coreutils 'timeout' which is not available on macOS runners.
          echo "Waiting for Docker daemon to be ready..."
          for i in $(seq 1 30); do
            docker info &>/dev/null && break
            sleep 2
          done
          # Detect the colima VM's IP by SSHing into the VM and reading
          # the network interfaces directly. This is more reliable than
          # 'colima list -j': Lima may not populate the address field in its
          # metadata for minutes (or at all within our window), whereas the
          # VM's interface is configured during boot and visible via 'ip addr'
          # as soon as SSH is available.
          #
          # Two subnets depending on the hypervisor backend:
          #   192.168.64.0/24 — vznat (Apple Virtualization Framework, Apple Silicon)
          #   192.168.5.0/24  — Lima usernet/SLIRP (QEMU, Intel)
          #
          # IMPORTANT: we need the VM's IP, not the macOS host's IP.
          # util::get_macos_ipaddress uses 'route get default' + 'ipconfig
          # getifaddr' on the host, which returns the host-side bridge address
          # (e.g. 192.168.64.1). Docker containers run INSIDE the VM and can
          # only bind to the VM's own interfaces — so kind must be given the
          # VM's IP, not the host's.
          echo "Detecting colima VM IP via SSH..."
          COLIMA_IP=""
          for i in $(seq 1 30); do
            COLIMA_IP=$(colima ssh -- ip -4 addr show 2>/dev/null \
              | awk '/inet (192\.168\.64\.|192\.168\.5\.)/{split($2,a,"/"); ip=a[1]; if(ip !~ /\.1$/) {print ip; exit}}' \
              || true)
            [[ -n "${COLIMA_IP}" ]] && break
            sleep 2
          done
          if [[ -n "${COLIMA_IP}" ]]; then
            echo "Colima VM IP: ${COLIMA_IP}"
            # Verify Docker can actually bind to this IP before kind attempts it.
            # The vznat interface being up does not guarantee Docker port binding
            # works yet — this loop gates on the exact mechanism kind uses.
            # Exits 1 on timeout so the job fails fast and visibly.
            echo "Waiting for Docker to be able to bind to ${COLIMA_IP}..."
            BIND_OK=false
            for i in $(seq 1 60); do
              docker run --rm --publish "${COLIMA_IP}:19876:19876" alpine true \
                &>/dev/null 2>&1 && BIND_OK=true && break
              sleep 2
            done
            if [[ "${BIND_OK}" != "true" ]]; then
              echo "ERROR: Docker could not bind to ${COLIMA_IP} after 120s — kind will fail"
              exit 1
            fi
            # Pre-populate MAC_NIC_IPADDRESS so util::get_macos_ipaddress uses
            # this confirmed-bindable VM IP and skips host-side auto-detection.
            echo "MAC_NIC_IPADDRESS=${COLIMA_IP}" >> "${GITHUB_ENV}"
            echo "${COLIMA_IP} is confirmed bindable — kind is safe to run"
          else
            echo "ERROR: could not detect colima VM IP after 60s — aborting"
            exit 1
          fi
      - name: install kind and kubectl
        run: brew install kind kubectl
      - name: setup e2e test environment
        run: |
          export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
          export KUBE_CACHE_MUTATION_DETECTOR=true
          hack/local-up-karmada.sh
      - name: verify control plane
        run: |
          export KUBECONFIG=$HOME/.kube/karmada.config
          kubectl --context karmada-apiserver get pods -A
          kubectl --context karmada-host get pods -A
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_macos_kind_log
          path: /tmp/karmada/
