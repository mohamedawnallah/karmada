name: CI Workflow
on:
  # Run this workflow every time a new commit pushed to upstream/fork repository.
  # Run workflow on fork repository will help contributors find and resolve issues before sending a PR.
  push:
    # Exclude branches created by Dependabot to avoid triggering current workflow
    # for PRs initiated by Dependabot.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read  # for actions/checkout to fetch code
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: verify license
        run: hack/verify-license.sh
      - name: vendor
        run: hack/verify-vendor.sh
      - name: lint
        run: hack/verify-staticcheck.sh
      - name: import alias
        run: hack/verify-import-aliases.sh
  codegen:
    name: codegen
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '23.4'
          # Use the automatic token, so that this task can be run in the forked repo.
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify codegen
        run: hack/verify-codegen.sh
      - name: verify crdgen
        run: hack/verify-crdgen.sh
      - name: verify protobuf
        run: hack/verify-estimator-protobuf.sh
      - name: verify swagger docs
        run: hack/verify-swagger-docs.sh
      - name: verify lifted docs
        run: hack/verify-lifted.sh
  build:
    name: compile
    needs: codegen # rely on codegen successful completion
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: compile
        run: make all
  test:
    name: unit test
    needs: build
    runs-on: ubuntu-22.04
    env:
      GOTESTSUM_ENABLED: enabled
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: make test
        run: make test
      - name: Upload coverage to Codecov
        # Prevent running from the forked repository that doesn't need to upload coverage.
        # In addition, running on the forked repository would fail as missing the necessary secret.
        if: ${{ github.repository == 'karmada-io/karmada' }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          # Even though token upload token is not required for public repos,
          # but adding a token might increase successful uploads as per:
          # https://community.codecov.com/t/upload-issues-unable-to-locate-build-via-github-actions-api/3954
          token: ${{secrets.CODECOV_UPLOAD_TOKEN}}
          files: ./_output/coverage/coverage_pkg.txt,./_output/coverage/coverage_cmd.txt,./_output/coverage/coverage_examples.txt,./_output/coverage/coverage_operator.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true
  e2e:
    name: e2e test (ubuntu-22.04, ${{ matrix.k8s }})
    if: false # temporarily disabled — only testing macos e2e on this branch
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Here support the latest three minor releases of Kubernetes, this can be considered to be roughly
        # the same as the End of Life of the Kubernetes release: https://kubernetes.io/releases/
        # Please remember to update the CI Schedule Workflow when we add a new version.
        k8s: [ v1.33.0, v1.34.0, v1.35.0 ]
    steps:
      # Free up disk space on Ubuntu
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # this might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Number of commits to fetch. 0 indicates all history for all branches and tags.
          # We need to guess version via git tags.
          fetch-depth: 0
      - name: install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: setup e2e test environment
        run: |
          export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
          export KUBE_CACHE_MUTATION_DETECTOR=true
          hack/local-up-karmada.sh
      - name: run e2e
        run: |
          export ARTIFACTS_PATH=${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
          hack/run-e2e.sh
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_e2e_log_${{ matrix.k8s }}
          path: ${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_kind_log_${{ matrix.k8s }}
          path: /tmp/karmada/
  e2e-macos:
    name: e2e test (macos-26-intel, ${{ matrix.k8s }})
    strategy:
      fail-fast: false
      matrix:
        k8s: [ v1.35.0 ]
    # Intel runner required: ARM macOS runners block nested virtualization
    # (Apple Virtualization Framework limitation), so Colima cannot start a
    # Linux VM on ARM. Intel runners have Hypervisor.framework enabled, allowing
    # Colima to provision the Linux VM that Docker and kind run inside.
    runs-on: macos-26-intel
    # Job failure will not block the overall workflow while the macos-26-intel
    # local-up path is being validated. Remove once proven stable.
    continue-on-error: true
    timeout-minutes: 90
    env:
      COLIMA_VERSION: "0.10.1"
      LIMA_VERSION: "2.1.1"
      DOCKER_VERSION: "29.4.0"
      DOCKER_BUILDX_VERSION: "0.33.0"
      # Go and kind versions are pinned to match go.mod / hack/util.sh
      GO_VERSION: "1.25.7"
      KIND_VERSION: "v0.31.0"
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: install Go, kind, and kubectl (macOS host)
        run: |
          # Installed BEFORE colima start intentionally: colima's VZ --network-address
          # mode attempts to bind port 53 on the host during startup, which can
          # temporarily disrupt DNS. Installing tools here guarantees clean DNS.
          #
          # Download to temp files first (not piped) so curl DNS/HTTP failures are
          # caught immediately rather than silently producing an empty tar extraction.
          curl -fsSL -o /tmp/go.tar.gz \
            "https://go.dev/dl/go${GO_VERSION}.darwin-amd64.tar.gz"
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz && rm /tmp/go.tar.gz
          sudo curl -fsSL \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-darwin-amd64" \
            -o /usr/local/bin/kind && sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL \
            "https://dl.k8s.io/release/${{ matrix.k8s }}/bin/darwin/amd64/kubectl" \
            -o /usr/local/bin/kubectl && sudo chmod +x /usr/local/bin/kubectl
          # Download Alpine minirootfs + apk packages HERE (before colima start) because:
          #   1. colima's VZ --network-address disrupts macOS host DNS during startup.
          #   2. Lima's usernet (gvisor-tap-vsock) TCP stack hangs on large downloads
          #      from inside the VM (both rootfs and package downloads affected).
          # All files are shared into the VM via virtiofs (colima mounts ${HOME} at the
          # same path inside the VM) and installed offline — no VM network access needed.
          ALPINE_DIR="${HOME}/alpine-assets"
          mkdir -p "${ALPINE_DIR}"
          # Alpine minirootfs (base filesystem)
          curl -fsSL --max-time 120 --retry 3 --retry-delay 2 \
            "https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/alpine-minirootfs-3.23.3-x86_64.tar.gz" \
            -o "${ALPINE_DIR}/alpine-minirootfs-3.23.3-x86_64.tar.gz" \
            || { echo "FATAL: cannot download Alpine rootfs"; exit 1; }
          # Parse APKINDEX to find exact package versions for offline installation.
          # karmada's cluster/images/Dockerfile requires ca-certificates and tzdata.
          # ca-certificates depends on ca-certificates-bundle; both must be provided.
          curl -fsSL --max-time 60 --retry 3 \
            "https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/APKINDEX.tar.gz" \
            | tar -xzO APKINDEX 2>/dev/null > "${HOME}/APKINDEX-main.txt" \
            || { echo "FATAL: cannot download APKINDEX"; exit 1; }
          # Note: 'exit' inside an awk pattern-action rule still executes the END block
          # in gawk, causing double-printing and embedded newlines in the variable.
          # Use 'found' flag instead of 'exit' to avoid this.
          get_ver() {
            local pkg=$1
            awk -v p="$pkg" '
              BEGIN{found=0}
              /^P:/{cur=substr($0,3); v=""}
              !found && cur==p && /^V:/{v=substr($0,3)}
              !found && /^$/{if(cur==p && v!=""){print v; found=1}}
              END{if(!found && cur==p && v!=""){print v}}
            ' "${HOME}/APKINDEX-main.txt" | head -1
          }
          CA_VER=$(get_ver "ca-certificates")
          CAB_VER=$(get_ver "ca-certificates-bundle")
          TZ_VER=$(get_ver "tzdata")
          [[ -n "$CA_VER" && -n "$CAB_VER" && -n "$TZ_VER" ]] \
            || { echo "FATAL: failed to parse package versions from APKINDEX"; exit 1; }
          echo "Package versions: ca-certificates=${CA_VER} bundle=${CAB_VER} tzdata=${TZ_VER}"
          BASE_PKG_URL="https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64"
          curl -fsSL --max-time 60 --retry 3 \
            "${BASE_PKG_URL}/ca-certificates-bundle-${CAB_VER}.apk" \
            -o "${ALPINE_DIR}/ca-certificates-bundle.apk" \
            || { echo "FATAL: cannot download ca-certificates-bundle"; exit 1; }
          curl -fsSL --max-time 60 --retry 3 \
            "${BASE_PKG_URL}/ca-certificates-${CA_VER}.apk" \
            -o "${ALPINE_DIR}/ca-certificates.apk" \
            || { echo "FATAL: cannot download ca-certificates"; exit 1; }
          curl -fsSL --max-time 60 --retry 3 \
            "${BASE_PKG_URL}/tzdata-${TZ_VER}.apk" \
            -o "${ALPINE_DIR}/tzdata.apk" \
            || { echo "FATAL: cannot download tzdata"; exit 1; }
          echo "Alpine assets downloaded: $(ls -lh ${ALPINE_DIR})"
          export PATH=/usr/local/go/bin:$PATH
          echo "Installed on macOS host: go=$(go version) | kind=$(kind version) | kubectl=$(kubectl version --client)"
      - name: install and start colima (docker) with network address
        run: |
          # Install pinned versions directly from GitHub/Docker releases to avoid
          # silent version drift from brew. Versions are pinned in the job env block.
          #
          # --connect-timeout 30 --max-time 300: prevent silent hangs on flaky runners.
          # Without these, curl waits indefinitely and produces zero output, making the
          # step appear to succeed until bash -e catches the pipe exit code.
          #
          # lima: colima is a wrapper around Lima — limactl must be on PATH before colima start
          echo "Downloading lima v${LIMA_VERSION}..."
          curl -fsSL --connect-timeout 30 --max-time 300 \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Darwin-x86_64.tar.gz" \
            | sudo tar -xz --strip=1 -C /usr/local \
            || { echo "ERROR: failed to download/extract lima v${LIMA_VERSION}"; exit 1; }
          echo "lima installed: $(limactl --version 2>/dev/null || echo unknown)"
          # colima: runs a Linux VM via Hypervisor.framework so Docker containers work on macOS
          echo "Downloading colima v${COLIMA_VERSION}..."
          curl -fsSL --connect-timeout 30 --max-time 120 \
            "https://github.com/abiosoft/colima/releases/download/v${COLIMA_VERSION}/colima-Darwin-x86_64" \
            -o /usr/local/bin/colima && chmod +x /usr/local/bin/colima \
            || { echo "ERROR: failed to download colima v${COLIMA_VERSION}"; exit 1; }
          echo "colima installed: $(colima version 2>/dev/null || echo unknown)"
          # docker: CLI to talk to the daemon inside the Colima VM
          echo "Downloading docker v${DOCKER_VERSION}..."
          curl -fsSL --connect-timeout 30 --max-time 120 \
            "https://download.docker.com/mac/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" \
            | tar -xz --strip=1 -C /usr/local/bin docker/docker \
            || { echo "ERROR: failed to download/extract docker v${DOCKER_VERSION}"; exit 1; }
          echo "docker installed: $(docker --version 2>/dev/null || echo unknown)"
          # docker-buildx: hack/docker.sh passes --provenance=false to docker build which requires
          #   the buildx plugin; Colima's Docker does not include it by default
          mkdir -p ~/.docker/cli-plugins
          echo "Downloading docker-buildx v${DOCKER_BUILDX_VERSION}..."
          curl -fsSL --connect-timeout 30 --max-time 120 \
            "https://github.com/docker/buildx/releases/download/v${DOCKER_BUILDX_VERSION}/buildx-v${DOCKER_BUILDX_VERSION}.darwin-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx && chmod +x ~/.docker/cli-plugins/docker-buildx \
            || { echo "ERROR: failed to download docker-buildx v${DOCKER_BUILDX_VERSION}"; exit 1; }
          echo "All tools installed: colima=$(colima version) | docker=$(docker --version) | buildx=$(docker buildx version)"
          # --vm-type vz: Apple Virtualization Framework (VZ) is the only hypervisor
          # available on macOS-26 runners — QEMU is not installed (qemu-img not found).
          # VZ on Intel Mac exposes the native physical CPU, so Go 1.25's pre-compiled
          # toolchain runs without 'signal: illegal instruction'.
          #
          # --network-address: assigns a vmnet IP (e.g. 192.168.64.x) to the VM via
          # VZ NAT networking. This IP is directly reachable from the macOS host,
          # enabling hack scripts to run on the macOS host instead of inside the VM.
          #
          # How the network routing works end-to-end:
          #  1. colima assigns VM a routable vmnet IP (VM_IP).
          #  2. HOST_IPADDRESS=$VM_IP is exported; hack/setup-dev-base.sh injects
          #       apiServerAddress: <VM_IP>
          #     into each kind cluster config (member1/2/3 YAML, lines 125-127).
          #  3. kind binds its API server on VM_IP inside the VM; Docker publishes
          #       VM_IP:PORT → container:6443.
          #  4. util::check_clusters_ready (darwin code path) calls
          #       get_docker_host_ip_port → returns VM_IP:PORT from docker inspect.
          #     kubeconfig server is set to https://VM_IP:PORT.
          #  5. From macOS: VM_IP:PORT is reachable via the vmnet interface. ✓
          #  6. From containers inside the VM: VM_IP is a local interface. ✓
          #  No SSH tunnels, no port-forwarding patches needed.
          #
          # Note: colima 0.10.1 with VZ performs two VM starts in sequence (~4min
          # overhead, not wasted compute). The first start boots the VM but colima's
          # internal Docker-daemon readiness timer (~29s) fires before Docker responds.
          # Colima then restarts from the warm disk — Docker starts faster the second
          # time and completes successfully. This is expected behaviour.
          #
          # --verbose surfaces Lima/VZ logs so hangs are diagnosable in CI.
          #
          # DNS situation on GitHub macOS-26 (Azure-hosted) runners:
          #   • Lima's usernet DNS proxy (192.168.5.1:53): needs to bind 0.0.0.0:53 on
          #     the host — host already has mDNSResponder there → Lima can't bind →
          #     usernet DNS broken.
          #   • Direct external DNS (8.8.8.8:53, 1.1.1.1:53): outbound UDP/TCP port 53
          #     to external IPs is blocked by the Azure datacenter firewall.
          #   • Host vmnet IP (192.168.64.1:53): mDNSResponder is bound to 0.0.0.0:53
          #     but only responds to localhost — ignores queries from VM (timeout).
          #
          # Fix: Python DNS-over-HTTPS proxy (applied after colima starts via colima ssh).
          #   Python3 is pre-installed in Ubuntu — no binary downloads required.
          #   A UDP stub on 127.0.0.1:53 base64url-encodes each DNS query and forwards
          #   it to https://1.1.1.1/dns-query (port 443). Outbound TCP 443 is NOT
          #   blocked by Azure — same path docker pull uses for image layers.
          #   /etc/resolv.conf is set to 127.0.0.1; daemon.json also points there so
          #   both Docker daemon and BuildKit resolve via the proxy.
          #
          # --cpu 4 --memory 6: leave headroom for 'go build' which cross-compiles
          # karmada binaries on the macOS host AFTER colima starts. With 6 CPUs/12GB
          # the host was OOM-starved and go build was SIGKILL'd after ~2m44s.
          colima start --cpu 4 --memory 6 --vm-type vz --network-address --verbose
          echo "colima status after start:"
          colima status
          # Wait for the Docker daemon inside the Colima VM to be fully ready.
          # Avoid GNU coreutils 'timeout' which is not available on macOS runners.
          echo "Waiting for Docker daemon to be ready..."
          for i in $(seq 1 30); do
            docker info &>/dev/null && break
            sleep 2
          done
          docker info &>/dev/null || { echo "ERROR: Docker daemon not ready after 60s"; exit 1; }
          # Extract the VM's vmnet IP NOW (before DNS setup) so it is available
          # for daemon.json — Docker's embedded DNS (127.0.0.11) rejects loopback
          # upstreams, so we must point it at the non-loopback vmnet IP.
          VM_IP=$(colima list 2>/dev/null | awk 'NR==2 && NF>=8 {print $NF}')
          if [[ -z "${VM_IP}" ]]; then
            echo "ERROR: --network-address did not produce a routable VM IP."
            echo "colima list:"; colima list
            exit 1
          fi
          echo "Colima VM vmnet IP: ${VM_IP}"
          # Fix VM DNS using a Python DNS-over-HTTPS proxy (no downloads required).
          # Python3 is pre-installed in the Ubuntu VM image.
          # All standard port-53 DNS paths fail on GitHub macOS-26 (Azure) runners:
          #   • Lima usernet DNS proxy (192.168.5.1:53): Lima tries to bind 0.0.0.0:53
          #     on the host; mDNSResponder already holds that port → Lima proxy fails.
          #   • External IPs (8.8.8.8, 1.1.1.1) on port 53: outbound UDP/TCP port 53
          #     to external IPs is blocked by Azure's datacenter firewall.
          #   • Host vmnet IP (192.168.64.1:53): mDNSResponder only serves localhost —
          #     ignores queries arriving from the VM (timeout).
          # Solution: Python UDP stubs on 127.0.0.1:53 (for VM /etc/resolv.conf)
          #   AND VM_IP:53 (for Docker's embedded DNS upstream in daemon.json).
          #   Both sockets encode DNS queries in base64url and forward to
          #   https://1.1.1.1/dns-query (DoH, port 443). TCP 443 is NOT blocked.
          #   Two sockets are needed because Docker's embedded DNS (127.0.0.11)
          #   filters loopback upstreams — daemon.json must point to VM_IP (non-loopback)
          #   while /etc/resolv.conf keeps the proven 127.0.0.1 binding.
          echo "Installing Python DoH proxy in VM..."
          DNS_SCRIPT=$(mktemp)
          # Write the DNS_SCRIPT without any heredocs — bash -s reads from stdin
          # (the temp file), and nested heredocs in that script can steal from the same
          # stdin. Writing Python line-by-line with printf/echo avoids that conflict.
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'systemctl stop systemd-resolved 2>/dev/null || true' \
            '# Write Python DoH proxy to /tmp/doh.py line by line.' \
            '# Key improvements over a naive proxy:' \
            '#   - ssl.create_default_context() built once, reused by all threads' \
            '#     (avoids per-request CA-bundle load and saves ~200ms per query).' \
            '#   - timeout=4s: Go'\''s DNS client times out after ~5s; 4s gives python' \
            '#     time to respond before Go retries or abandons the query.' \
            '#   - retry loop (3 attempts): covers transient SSL / TCP resets.' \
            '#   - recvfrom(4096): handles EDNS0 extended-size queries (>512 bytes).' \
            'rm -f /tmp/doh.py' \
            'echo "import socket,threading,urllib.request as u,base64,ssl,time" >> /tmp/doh.py' \
            'echo "ctx=ssl.create_default_context()" >> /tmp/doh.py' \
            'echo "_cache={}" >> /tmp/doh.py' \
            'echo "_cL=threading.Lock()" >> /tmp/doh.py' \
            'echo "def h(d,a,s):" >> /tmp/doh.py' \
            'echo "    ck=d[12:];tid=d[:2];t=time.time()" >> /tmp/doh.py' \
            'echo "    with _cL:" >> /tmp/doh.py' \
            'echo "        if ck in _cache and _cache[ck][1]>t:" >> /tmp/doh.py' \
            'echo "            s.sendto(tid+_cache[ck][0][2:],a); return" >> /tmp/doh.py' \
            'echo "    b=base64.urlsafe_b64encode(d).rstrip(b\"=\").decode()" >> /tmp/doh.py' \
            'echo "    for _ in range(3):" >> /tmp/doh.py' \
            'echo "        try:" >> /tmp/doh.py' \
            'echo "            rq=u.Request(\"https://1.1.1.1/dns-query?dns=\"+b,headers={\"Accept\":\"application/dns-message\"})" >> /tmp/doh.py' \
            'echo "            with u.urlopen(rq,context=ctx,timeout=4) as x:" >> /tmp/doh.py' \
            'echo "                rr=x.read()" >> /tmp/doh.py' \
            'echo "            with _cL: _cache[ck]=(rr,t+600)" >> /tmp/doh.py' \
            'echo "            s.sendto(rr,a); return" >> /tmp/doh.py' \
            'echo "        except Exception as e: print(\"DoH:\",e,flush=True)" >> /tmp/doh.py' \
            'echo "def listen(k):" >> /tmp/doh.py' \
            'echo "    while True:" >> /tmp/doh.py' \
            'echo "        d,a=k.recvfrom(4096)" >> /tmp/doh.py' \
            'echo "        threading.Thread(target=h,args=(d,a,k),daemon=True).start()" >> /tmp/doh.py' \
            'echo "k1=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)" >> /tmp/doh.py' \
            'echo "k1.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)" >> /tmp/doh.py' \
            'echo "k1.bind((\"127.0.0.1\",53))" >> /tmp/doh.py' \
            "echo \"k2=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)\" >> /tmp/doh.py" \
            "echo \"k2.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)\" >> /tmp/doh.py" \
            "echo \"k2.bind(('${VM_IP}',53))\" >> /tmp/doh.py" \
            "echo \"print('DoH proxy on 127.0.0.1:53 and ${VM_IP}:53',flush=True)\" >> /tmp/doh.py" \
            "echo \"threading.Thread(target=listen,args=(k2,),daemon=True).start()\" >> /tmp/doh.py" \
            'echo "listen(k1)" >> /tmp/doh.py' \
            'nohup python3 /tmp/doh.py >/var/log/doh-proxy.log 2>&1 &' \
            'sleep 3' \
            'rm -f /etc/resolv.conf' \
            'printf "nameserver 127.0.0.1\n" > /etc/resolv.conf' \
            'mkdir -p /etc/docker' \
            "printf '{\"dns\":[\"${VM_IP}\"]}\n' > /etc/docker/daemon.json" \
            'getent hosts registry-1.docker.io && echo "DoH DNS OK" \' \
            '  || { echo "DoH DNS FAILED"; cat /var/log/doh-proxy.log; exit 1; }' \
            '# Pre-warm DNS A-records (IPv4) via getent ahostsv4 — forces AF_INET queries.' \
            '# getent hosts sends AAAA (IPv6-preferred on Ubuntu), caching the wrong type.' \
            '# Docker containers use A queries (no IPv6 by default); ahostsv4 ensures' \
            '# the shared k1/k2 cache is populated with A records before docker build.' \
            'getent ahostsv4 dl-cdn.alpinelinux.org || true' \
            'getent ahostsv4 auth.docker.io || true' \
            'getent ahostsv4 registry-1.docker.io || true' \
            'getent ahostsv4 registry.k8s.io || true' \
            'echo "DNS A-record pre-warm complete."' \
            'echo "daemon.json content:"; cat /etc/docker/daemon.json' \
            'echo "Port 53 listeners before restart:"; ss -ulnp | grep ":53 " || true' \
            'timeout 120 systemctl restart docker \' \
            '  || { echo "Docker restart FAILED (exit=$?):"; journalctl -u docker.service --no-pager -n 60; exit 1; }' \
            'echo "Port 53 listeners AFTER restart:"; ss -ulnp | grep ":53 " || true' \
            'echo "DoH proxy log after restart:"; cat /var/log/doh-proxy.log' \
            > "$DNS_SCRIPT"
          colima ssh -- sudo bash -s < "$DNS_SCRIPT"
          rm -f "$DNS_SCRIPT"
          for i in $(seq 1 30); do
            docker info &>/dev/null && break
            sleep 2
          done
          docker info &>/dev/null || { echo "ERROR: Docker not ready after DNS fix"; exit 1; }
          # Build alpine:3.23.3 with ca-certificates + tzdata pre-installed, entirely
          # offline. All assets (rootfs + .apk packages) were downloaded on the macOS
          # host in the previous step (before colima start, with clean DNS) and are
          # shared into the VM via virtiofs at the same path. No VM network access needed.
          #
          # The Dockerfile uses COPY to bring in pre-downloaded .apk files and installs
          # them with 'apk add --allow-untrusted' (local files, no repo fetch).
          # /etc/apk/repositories is cleared so that karmada's Dockerfile lines:
          #   RUN apk add --no-cache ca-certificates
          #   RUN apk add --no-cache tzdata
          # find packages already installed + no repos to sync => return 0, no network.
          # (karmada Dockerfile has ARG BINARY before RUN, so BuildKit caches per-binary
          # and runs apk add once per image ~20 times; with offline base this is fine.)
          echo "Building alpine:3.23.3 (offline, all assets from virtiofs) inside VM..."
          ALPINE_SCRIPT=$(mktemp)
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'mkdir -p /tmp/alpine-build' \
            "cp \"${HOME}/alpine-assets/alpine-minirootfs-3.23.3-x86_64.tar.gz\" /tmp/alpine-build/" \
            "cp \"${HOME}/alpine-assets/ca-certificates-bundle.apk\" /tmp/alpine-build/" \
            "cp \"${HOME}/alpine-assets/ca-certificates.apk\" /tmp/alpine-build/" \
            "cp \"${HOME}/alpine-assets/tzdata.apk\" /tmp/alpine-build/" \
            'printf "FROM scratch\nADD alpine-minirootfs-3.23.3-x86_64.tar.gz /\nCOPY ca-certificates-bundle.apk /tmp/\nCOPY ca-certificates.apk /tmp/\nCOPY tzdata.apk /tmp/\nRUN apk add --allow-untrusted /tmp/ca-certificates-bundle.apk /tmp/ca-certificates.apk /tmp/tzdata.apk && rm /tmp/*.apk && echo > /etc/apk/repositories\nCMD [\"/bin/sh\"]\n" > /tmp/alpine-build/Dockerfile' \
            'DOCKER_BUILDKIT=0 docker build -t alpine:3.23.3 /tmp/alpine-build/' \
            'rm -rf /tmp/alpine-build' \
            'echo "alpine:3.23.3 created with ca-certificates+tzdata pre-installed offline"' \
            'docker images alpine:3.23.3' \
            > "$ALPINE_SCRIPT"
          colima ssh -- sudo bash -s < "$ALPINE_SCRIPT"
          rm -f "$ALPINE_SCRIPT"
          echo "Python DoH DNS fix applied."
          # Pre-pull container images into the VM's Docker daemon.
          #
          # Background: util::create_cluster (setup-dev-base.sh) starts 4 kind clusters
          # in background (nohup ... &), then make images runs (~16 min), and only THEN
          # util::check_clusters_ready starts with a 300-second timeout.  If Docker
          # needs to pull kindest/node:v1.35.0 (~1-2 GB) from docker.io at that point,
          # the pull races against the timeout and often loses.
          #
          # Fix: pull all needed images here (DoH DNS is already working; vmnet gives the
          # VM real internet access via the macOS host). With images cached in Docker,
          # kind create cluster takes <60 s (no network pull) and the 300-s window is
          # more than enough.
          #
          # Images loaded here:
          #   kindest/node           — used directly by Docker to create kind node containers
          #   registry.k8s.io/etcd   — pulled by containerd inside karmada-host kind nodes
          #                            for the karmada-etcd StatefulSet
          #   kube-apiserver/kcm     — same, for the karmada apiserver/controller-manager
          #   metrics-server         — pulled by containerd in member cluster kind nodes
          #
          # We use DOCKER_HOST explicitly (GITHUB_ENV is not yet read in the current step).
          export DOCKER_HOST="unix://${HOME}/.colima/default/docker.sock"
          K8S_VER="${{ matrix.k8s }}"
          echo "Pre-pulling container images into VM Docker..."
          # --platform linux/amd64 is required: without it Docker stores a
          # multi-arch manifest index referencing platform variants whose layers
          # are not actually downloaded. 'kind load docker-image' then pipes
          # through 'ctr import --all-platforms', which fails because the
          # non-amd64 layer digests are absent from the content store.
          docker pull --platform linux/amd64 "kindest/node:${K8S_VER}" \
            || { echo "ERROR: failed to pull kindest/node:${K8S_VER}"; exit 1; }
          docker pull --platform linux/amd64 "registry.k8s.io/etcd:3.6.6-0" \
            || echo "WARNING: failed to pre-pull registry.k8s.io/etcd:3.6.6-0 (will retry on demand)"
          docker pull --platform linux/amd64 "registry.k8s.io/kube-apiserver:${K8S_VER}" \
            || echo "WARNING: failed to pre-pull kube-apiserver:${K8S_VER}"
          docker pull --platform linux/amd64 "registry.k8s.io/kube-controller-manager:${K8S_VER}" \
            || echo "WARNING: failed to pre-pull kube-controller-manager:${K8S_VER}"
          docker pull --platform linux/amd64 "registry.k8s.io/metrics-server/metrics-server:v0.6.3" \
            || echo "WARNING: failed to pre-pull metrics-server:v0.6.3"
          echo "Pre-pull complete. Cached Docker images:"
          docker images
          # Propagate to all subsequent steps via GITHUB_ENV.
          # DOCKER_HOST: host-side docker/kind/kubectl talk to VM's Docker daemon.
          echo "DOCKER_HOST=unix://${HOME}/.colima/default/docker.sock" >> $GITHUB_ENV
          # VM_IP: used below when invoking hack/local-up-karmada.sh.
          echo "VM_IP=${VM_IP}" >> $GITHUB_ENV
          # HOST_IPADDRESS: consumed by hack/setup-dev-base.sh to inject
          #   apiServerAddress into kind configs and set the Karmada API server bind IP.
          echo "HOST_IPADDRESS=${VM_IP}" >> $GITHUB_ENV
          # MAC_NIC_IPADDRESS: honoured by util::get_macos_ipaddress (early-return path)
          #   so the Karmada API server binds to VM_IP:5443 (reachable from macOS + VM).
          echo "MAC_NIC_IPADDRESS=${VM_IP}" >> $GITHUB_ENV
          # colima's VZ --network-address briefly disrupts macOS host network routing
          # when the vmnet interface activates. If the GitHub Actions runner daemon
          # loses its heartbeat connection to GitHub at this moment, the NEXT step
          # is marked "The operation was canceled" before it produces any log output.
          # Wait here (still in step 4) until HTTPS to GitHub is restored, so the
          # runner is fully reconnected before step 5 begins.
          echo "Waiting for macOS host network to stabilize after colima vmnet activation..."
          for _i in $(seq 1 30); do
            if curl -sf --max-time 5 https://api.github.com/zen > /dev/null 2>&1; then
              echo "macOS host network: ok (attempt ${_i})"
              break
            fi
            echo "  attempt ${_i}: GitHub not reachable yet, retrying in 2s..."
            sleep 2
          done
      - name: setup e2e test environment
        run: |
          # Runs directly on macOS host — no colima ssh wrapper.
          #
          # DOCKER_HOST → colima VM daemon: 'docker build' and kind cluster creation
          #   happen inside the VM, but are driven from the macOS host.
          # HOST_IPADDRESS=$VM_IP / MAC_NIC_IPADDRESS=$VM_IP (set in previous step):
          #   hack/setup-dev-base.sh detects GOOS=darwin and calls
          #   util::get_macos_ipaddress, which honours MAC_NIC_IPADDRESS and returns
          #   VM_IP. All kind cluster configs get apiServerAddress: VM_IP injected,
          #   and the Karmada API server is bound to VM_IP:5443.
          # Kubeconfig endpoints end up as https://VM_IP:PORT — directly reachable
          # from macOS via the vmnet interface created by --network-address.
          #
          # Note: the lo0 alias for VM_IP (needed for kind's net.Listen port probe)
          # is now managed inside hack/setup-dev-base.sh: added before
          # util::create_cluster calls, removed before util::check_clusters_ready
          # so kubectl healthz traffic routes to the real VM interface, not loopback.
          export PATH=/usr/local/go/bin:/usr/local/bin:$HOME/go/bin:$PATH
          export GOPATH=$HOME/go
          export CLUSTER_VERSION=kindest/node:${{ matrix.k8s }}
          export KUBE_CACHE_MUTATION_DETECTOR=true
          # hack/build.sh cross-compiles karmada binaries natively on the macOS host
          # (GOOS=linux GOARCH=amd64 go build). GOMAXPROCS=2 (not 4) because:
          # 1. colima VM already occupies 4 of the runner's CPUs; leaving 2 threads
          #    for go build avoids OOM-kill from memory/CPU starvation.
          # 2. On macOS there are no cgroups, so Go 1.25's GOMAXPROCS updater
          #    goroutine is a no-op — the value stays stable throughout compilation.
          export GOMAXPROCS=2
          # These images were pre-pulled into VM Docker in the previous step.
          # setup-dev-base.sh's kind-load loop copies them from Docker into each
          # kind node's containerd, so pods never need to pull from the internet.
          #   HOST cluster: karmada-etcd (registry.k8s.io/etcd:3.6.6-0),
          #                  karmada-apiserver and kube-controller-manager (v1.35.0).
          #   MEMBER clusters: metrics-server (v0.6.3) deployed by
          #                    hack/deploy-k8s-metrics-server.sh in all 3 member clusters.
          export EXTRA_IMAGES_LOAD_TO_HOST_CLUSTER="registry.k8s.io/etcd:3.6.6-0,registry.k8s.io/kube-apiserver:${{ matrix.k8s }},registry.k8s.io/kube-controller-manager:${{ matrix.k8s }}"
          export EXTRA_IMAGES_LOAD_TO_MEMBER_CLUSTERS="registry.k8s.io/metrics-server/metrics-server:v0.6.3"
          hack/local-up-karmada.sh "${VM_IP}"
      - name: run e2e
        run: |
          # Runs directly on macOS host. kubectl and the Go test binary connect
          # to clusters at https://VM_IP:PORT via the vmnet interface — no SSH hop.
          export PATH=/usr/local/go/bin:/usr/local/bin:$HOME/go/bin:$PATH
          export GOPATH=$HOME/go
          export ARTIFACTS_PATH=${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
          hack/run-e2e.sh
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_macos_e2e_log_${{ matrix.k8s }}
          path: ${{ github.workspace }}/karmada-e2e-logs/${{ matrix.k8s }}/
      - name: collect kind logs from VM
        if: always()
        run: |
          # kind containers live inside the colima VM's Docker. 'kind export logs'
          # with DOCKER_HOST set talks to the VM daemon and writes logs locally.
          # Colima ssh fallback covers any logs written to /tmp/karmada in the VM.
          # Also copy host-side kind creation logs (written by util::create_cluster
          # via nohup into /tmp/karmada/*.log on the macOS host) — these contain
          # kind's stdout/stderr during cluster creation and are crucial for debugging
          # failures in util::check_clusters_ready.
          mkdir -p /tmp/karmada
          export PATH=/usr/local/go/bin:/usr/local/bin:$PATH
          # --- Diagnostic: running processes and containers ---
          echo "=== Running kind processes ==="
          ps aux | grep kind | grep -v grep || echo "(none)"
          echo "=== Docker containers ==="
          docker ps -a 2>/dev/null || echo "(docker ps failed)"
          echo "=== colima status ==="
          colima status 2>/dev/null || echo "(colima not running)"
          echo "=== ~/.kube contents ==="
          ls -la ~/.kube/ 2>/dev/null || echo "(~/.kube not found)"
          # --- Print host-side kind creation logs (crucial for debugging) ---
          for logfile in /tmp/karmada/karmada-host.log /tmp/karmada/member1.log /tmp/karmada/member2.log /tmp/karmada/member3.log /tmp/karmada/delete-necessary-resources.log; do
            if [[ -f "$logfile" ]]; then
              echo "=== ${logfile} ==="
              cat "$logfile"
              echo "=== end ${logfile} ==="
            fi
          done
          for cluster in karmada-host member1 member2 member3; do
            kind export logs /tmp/karmada --name "${cluster}" 2>/dev/null || true
          done
          colima ssh -- bash -c "tar -C /tmp -czf - karmada 2>/dev/null || true" \
            | tar -C /tmp -xzf - 2>/dev/null || true
      - name: upload kind logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karmada_macos_kind_log
          path: /tmp/karmada/
